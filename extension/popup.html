<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      width: 220px;
      padding: 16px;
      margin: 0;
      background: #fff;
    }
    h2 {
      margin: 0 0 4px;
      font-size: 15px;
      color: #1a1a1a;
    }
    p {
      margin: 0 0 14px;
      font-size: 12px;
      color: #666;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1d6f3b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #165c30; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>Golf Raffle Autofill</h2>
  <p>Fills your info — then solve the CAPTCHA and submit.</p>
  <button id="fill">Autofill Form</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
